; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html


[platformio]
default_envs = esp32-c3-prod-managed

[common]
espressif32_platform = platformio/espressif32@6.12.0

monocypher_lib_dep =
    https://github.com/LoupVaillant/Monocypher.git#c0e0efd25b614ef22bb72aa71203a747904c370d

arduinojson_lib_dep =
    bblanchon/ArduinoJson@6.21.6

radiolib_lib_dep =
    jgromes/RadioLib@7.6.0

arduino_usb_cdc_build_flags =
    -DDEBUG_ENABLED=1
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

kiss_over_usb_build_flags =
    -DKISS_OVER_USB=1

integration_firmware_src_filter =
    ${common.full_firmware_src_filter}
    -<main.cpp>
    +<integration_main.cpp>

full_firmware_src_filter =
    +<*>
    +<svfprintf_stub.cpp>
    -<minimal_main.cpp>
    -<main.c>
    -<integration_main.cpp>
    -<test_serial_main.cpp>
    -<bare_blink.c>
    -<kiss_usb_test.cpp>
    -<main.original.cpp>

; Common build settings


; ESP32-C3





[env:esp32-c3-debug]
platform = ${common.espressif32_platform}
framework = arduino
board = esp32-c3-devkitm-1
board_build.flash_mode = dio
board_build.f_flash = 40000000L
board_build.partitions = default.csv
monitor_speed = 115200
lib_deps =
    ${common.monocypher_lib_dep}
build_flags =
    -Og
    -g
    ${common.arduino_usb_cdc_build_flags}
    ${common.kiss_over_usb_build_flags}
build_src_filter =
    ${common.full_firmware_src_filter}


[env:esp32-c3-bare]
platform = ${common.espressif32_platform}
framework = espidf
board = esp32-c3-devkitm-1
monitor_speed = 115200
board_build.partitions = partitions_singleapp.csv
build_flags =
    -DCONFIG_IDF_TARGET_ESP32C3

; Development environment with Web UI + JSON config enabled (example)
[env:esp32-c3-web]
platform = ${common.espressif32_platform}
framework = arduino
board = esp32-c3-devkitm-1
board_build.mcu = esp32c3
board_build.f_cpu = 160000000
board_build.f_flash = 40000000L
board_build.flash_mode = dio
board_build.partitions = default.csv  ; ensure SPIFFS/data partition is available for JSON config and OTA
lib_deps =
    ${common.radiolib_lib_dep}
    ${common.arduinojson_lib_dep}
    ${common.monocypher_lib_dep}
build_flags =
    -I include/include
    -Os
    -DWEBSERVER_ENABLED=1
    -DJSON_CONFIG_ENABLED=1
    -DOTA_ENABLED=1
    -DWIFI_STA_CONNECT_ENABLED=1
    -DDEBUG_ENABLED=0
    -DFIRMWARE_VERSION=\"0.3.1\"
build_src_filter =
    ${common.full_firmware_src_filter}

; Temporary env to flash TTGO T-OI PLUS (ESP32-C3 with small display)
[env:ttgo-t-oi-plus]
platform = ${common.espressif32_platform}
framework = arduino
board = ttgo-t-oi-plus
board_build.mcu = esp32c3
board_build.f_cpu = 160000000
board_build.f_flash = 40000000L
board_build.flash_mode = dio
lib_deps =
    ${common.radiolib_lib_dep}
    ${common.arduinojson_lib_dep}
    ${common.monocypher_lib_dep}
build_flags =
    -I include/include
    -O0
    -DWEBSERVER_ENABLED=1
    -DJSON_CONFIG_ENABLED=1
    -DOTA_ENABLED=1
    -DDEBUG_ENABLED=0
build_src_filter =
    ${common.full_firmware_src_filter}

[env:ttgo-minimal]
platform = ${common.espressif32_platform}
framework = arduino
board = ttgo-t-oi-plus
board_build.mcu = esp32c3
board_build.f_cpu = 160000000
board_build.f_flash = 40000000L
board_build.flash_mode = dio
board_build.partitions = huge_app.csv
build_flags =
    -Os
; Only compile the minimal test source
build_src_filter =
    +<minimal_main.cpp>
    +<svfprintf_stub.cpp>

[env:test-serial]
platform = ${common.espressif32_platform}
framework = arduino
board = esp32-c3-devkitm-1
board_build.flash_mode = dio
board_build.f_flash = 40000000L
board_build.partitions = default.csv
monitor_speed = 115200
build_flags =
    -DDEBUG_ENABLED=1
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
build_src_filter =
    +<test_serial_main.cpp>
    +<svfprintf_stub.cpp>

; ESP32 (original)
[env:esp32dev]
platform = ${common.espressif32_platform}
framework = arduino
board = esp32dev
board_build.partitions = huge_app.csv
lib_deps =
    ${common.monocypher_lib_dep}
build_src_filter =
    ${common.full_firmware_src_filter}

; ESP32-S2
[env:esp32-s2-devkitm-1]
platform = ${common.espressif32_platform}
framework = arduino
board = esp32-s2-saola-1 ; esp32-s2-devkitm-1 not available in this PIO core; using Saola-1 as closest dev board
board_build.partitions = huge_app.csv
lib_deps =
    ${common.monocypher_lib_dep}
build_src_filter =
    ${common.full_firmware_src_filter}

; ESP32-S3
[env:esp32-s3-devkitc-1]
platform = ${common.espressif32_platform}
framework = arduino
board = esp32-s3-devkitc-1
board_build.partitions = huge_app.csv
lib_deps =
    ${common.monocypher_lib_dep}
build_src_filter =
    ${common.full_firmware_src_filter}

; ESP32-C5 (when available)

[env:esp32-c3-devkitm-1]
platform = ${common.espressif32_platform}
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
test_build_src = true
build_flags =
    ${common.arduino_usb_cdc_build_flags}
lib_deps =
    ${common.monocypher_lib_dep}
build_src_filter =
    ${common.full_firmware_src_filter}

[env:esp32-c3-prod]
platform = ${common.espressif32_platform}
board = esp32-c3-devkitm-1
framework = arduino
board_build.partitions = default.csv
; production build: optimize for size, treat warnings as errors, remove debug symbols
build_flags =
    -Os
    -Wall
    -Werror
    -DDEBUG_ENABLED=0
    -DDEMO_TRAFFIC_ENABLED=0
    -DJSON_CONFIG_ENABLED=1
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DUSB_VID=0x303A
    -DUSB_PID=0x1001
    -DFIRMWARE_VERSION=\"0.3.1\"

; you may also strip symbols later via `pio run -t strip`
lib_deps =
    ${common.monocypher_lib_dep}
    ${common.arduinojson_lib_dep}

build_src_filter =
    ${common.full_firmware_src_filter}

[env:esp32-c3-prod-usb]
extends = env:esp32-c3-prod
build_flags =
    ${env:esp32-c3-prod.build_flags}
    ${common.kiss_over_usb_build_flags}

; Canonical managed production artifact: USB KISS + ESP-NOW + WiFi API,
; authenticated configuration, metrics, and signed OTA.
[env:esp32-c3-prod-managed]
extends = env:esp32-c3-prod-usb
build_flags =
    ${env:esp32-c3-prod-usb.build_flags}
    -DPRODUCTION_BUILD=1
    -DWEBSERVER_ENABLED=1
    -DOTA_ENABLED=1
    -DMETRICS_ENABLED=1
    -DWIFI_STA_CONNECT_ENABLED=1

[env:esp32-c3-prod-metrics]
platform = ${common.espressif32_platform}
board = esp32-c3-devkitm-1
framework = arduino
board_build.partitions = default.csv
; production-with-metrics build
build_flags =
    -Os
    -Wall
    -Werror
    -DDEBUG_ENABLED=0
    -DDEMO_TRAFFIC_ENABLED=0
    -DJSON_CONFIG_ENABLED=1
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DUSB_VID=0x303A
    -DUSB_PID=0x1001
    -DMETRICS_ENABLED=1
    -DMETRICS_UDP_ENABLED=1

lib_deps =
    ${common.monocypher_lib_dep}
    ${common.arduinojson_lib_dep}

build_src_filter =
    ${common.full_firmware_src_filter}


; optional convenience environment that compiles with USB KISS automatically
[env:esp32-c3-kiss-usb]
extends = env:esp32-c3-devkitm-1
build_flags =
    ${env:esp32-c3-devkitm-1.build_flags}
    ${common.kiss_over_usb_build_flags}
    -DDEMO_TRAFFIC_ENABLED=0

; demo sender: standard firmware + demo traffic for testing ESP-NOW relay
[env:esp32-c3-demo-sender]
extends = env:esp32-c3-devkitm-1
build_flags =
    ${env:esp32-c3-devkitm-1.build_flags}
    ${common.kiss_over_usb_build_flags}
    -DDEMO_TRAFFIC_ENABLED=1

[env:esp32-c3-integration-rx]
platform = ${common.espressif32_platform}
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
lib_deps =
    ${common.monocypher_lib_dep}
build_flags =
    ${common.arduino_usb_cdc_build_flags}
    -DANNOUNCE_INTERVAL_DEFAULT_MS=10000UL
    -DINTEGRATION_SEND_INTERVAL_MS=15000UL
    -DINTEGRATION_NODE_ROLE=0
build_src_filter =
    ${common.integration_firmware_src_filter}

[env:esp32-c3-integration-tx]
platform = ${common.espressif32_platform}
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
lib_deps =
    ${common.monocypher_lib_dep}
build_flags =
    ${common.arduino_usb_cdc_build_flags}
    -DANNOUNCE_INTERVAL_DEFAULT_MS=10000UL
    -DINTEGRATION_SEND_INTERVAL_MS=5000UL
    -DINTEGRATION_NODE_ROLE=1
build_src_filter =
    ${common.integration_firmware_src_filter}

; minimal USB KISS test: just Serial1 debug + USB CDC echo, no WiFi/Reticulum
[env:esp32-c3-kiss-usb-test]
platform = ${common.espressif32_platform}
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
build_flags =
    -DKISS_OVER_USB=1
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
build_src_filter =
    +<kiss_usb_test.cpp>
    +<svfprintf_stub.cpp>
[env:esp32-c3-minimal]
platform = ${common.espressif32_platform}
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
build_src_filter =
    +<minimal_main.cpp>
    +<svfprintf_stub.cpp>
board_build.usb = cdc
upload_speed = 115200
board_build.flash_mode = dio
build_flags =
    -DDEBUG_ENABLED=1
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DUSB_VID=0x303A
    -DUSB_PID=0x1001

