; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html


[platformio]
default_envs = esp32-c3-devkitm-1

; Common build settings


; ESP32-C3





[env:esp32-c3-debug]
platform = espressif32
framework = arduino
board = esp32-c3-devkitm-1
board_build.flash_mode = dio
board_build.f_flash = 40000000L
board_build.partitions = default.csv
monitor_speed = 115200
build_flags =
    -Og
    -g
    -DDEBUG_ENABLED=1
    -DDISABLE_WIFI
build_src_filter =
    +<*>
    +<svfprintf_stub.cpp>
    -<minimal_main.cpp>
    -<main.c>
    -<test_serial_main.cpp>


[env:esp32-c3-bare]
platform = espressif32
framework = espidf
board = esp32-c3-devkitm-1
monitor_speed = 115200
build_src_filter =
    +<bare_blink.c>
board_build.partitions = partitions_singleapp.csv
build_flags =
    -DCONFIG_IDF_TARGET_ESP32C3

; Development environment with Web UI + JSON config enabled (example)
[env:esp32-c3-web]
board = esp32-c3-devkitm-1
board_build.mcu = esp32c3
board_build.f_cpu = 160000000
board_build.f_flash = 40000000L
board_build.flash_mode = dio
board_build.partitions = default.csv  ; ensure SPIFFS/data partition is available for JSON config and OTA
lib_deps =
    https://github.com/jgromes/RadioLib.git
    bblanchon/ArduinoJson@^6.20.0
    https://github.com/LoupVaillant/Monocypher.git
build_flags =
    -I include/include
    -Os
    -DWEBSERVER_ENABLED=1
    -DJSON_CONFIG_ENABLED=1
    -DOTA_ENABLED=1
    -DDEBUG_ENABLED=0
    -DCONFIG_ESP_WIFI_DYNAMIC_RX_MGMT_BUF=1
    -include src/compat_interrupt.h
build_src_filter =
    +<*>
    +<svfprintf_stub.cpp>
    -<minimal_main.cpp>
    -<main.c> 

; Temporary env to flash TTGO T-OI PLUS (ESP32-C3 with small display)
[env:ttgo-t-oI-plus]
platform = espressif32
framework = arduino
board = ttgo-t-oI-plus
board_build.mcu = esp32c3
board_build.f_cpu = 160000000
board_build.f_flash = 40000000L
board_build.flash_mode = dio
lib_deps =
    https://github.com/jgromes/RadioLib.git
    bblanchon/ArduinoJson@^6.20.0
    https://github.com/LoupVaillant/Monocypher.git
build_flags =
    -I include/include
    -O0
    -DWEBSERVER_ENABLED=1
    -DJSON_CONFIG_ENABLED=1
    -DDEBUG_ENABLED=0
    -DCONFIG_ESP_WIFI_DYNAMIC_RX_MGMT_BUF=1
    -include src/compat_interrupt.h
build_src_filter =
    +<*>
    +<svfprintf_stub.cpp>
    -<minimal_main.cpp>
    -<main.c>

[env:ttgo-minimal]
platform = espressif32
framework = arduino
board = ttgo-t-oI-plus
 board_build.mcu = esp32c3
 board_build.f_cpu = 160000000
board_build.f_flash = 4194304
board_build.flash_mode = dio
board_build.partitions = huge_app.csv
build_flags =
    -Os
; Only compile the minimal test source
build_src_filter =
    +<minimal_main.cpp>
    +<svfprintf_stub.cpp>

[env:test-serial]
platform = espressif32
framework = arduino
board = esp32-c3-devkitm-1
board_build.flash_mode = dio
board_build.f_flash = 40000000L
board_build.partitions = default.csv
monitor_speed = 115200
build_flags =
    -DDEBUG_ENABLED=1
build_src_filter =
    +<test_serial_main.cpp>
    +<svfprintf_stub.cpp>

; ESP32 (original)
[env:esp32dev]
platform = espressif32
framework = arduino
board = esp32dev
board_build.partitions = huge_app.csv
build_src_filter =
    +<*>
    -<minimal_main.cpp>
    -<main.c>
    -<test_serial_main.cpp>
    -<bare_blink.c>

; ESP32-S2
[env:esp32-s2-devkitm-1]
board = esp32-s2-saola-1 ; esp32-s2-devkitm-1 not available in this PIO core; using Saola-1 as closest dev board
board_build.partitions = huge_app.csv

; ESP32-S3
[env:esp32-s3-devkitc-1]
board = esp32-s3-devkitc-1
board_build.partitions = huge_app.csv

; ESP32-C5 (when available)

[env:esp32-c3-devkitm-1]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
# native USB interface: enable CDC device mode
board_build.usb = cdc

monitor_speed = 115200
upload_speed = 115200
board_build.flash_mode = dio
; USB port is auto-detected by esptool; do **not** hard-code upload_port here
upload_flags =
    --before
    default_reset
    --after
    no_reset
monitor_filters = esp32_exception_decoder
build_flags =
    ${env.build_flags}
    -DDEBUG_ENABLED=0                 ; disable debug build for normal operation
    ; demo traffic sends a periodic packet every 10 seconds, useful for
    ; development but noisy in normal use.  Disable by default; enable only
    ; in a custom build_flags override when needed.
    -DDEMO_TRAFFIC_ENABLED=0
    -DARDUINO_USB_MODE=1              ; enable TinyUSB support
    -DARDUINO_USB_CDC_ON_BOOT=1       ; make Serial() the USB CDC port
    -DUSB_VID=0x303A                  ; match bootloader VID (kept so same driver works)
    -DUSB_PID=0x1001                  ; use same PID as bootloader – avoids driver installation issues
    ; Wi‑Fi is enabled by default (no -DDISABLE_WIFI here)
    ; To route the KISS interface over the USB/CDC connection instead of
    ; a hardware UART, add the following when building:
    ;     -DKISS_OVER_USB=1

build_src_filter =
    +<*>
    +<svfprintf_stub.cpp>
    -<minimal_main.cpp>
    -<test_serial_main.cpp>
    -<main.c>
    -<bare_blink.c>

; optional convenience environment that compiles with USB KISS automatically
[env:esp32-c3-kiss-usb]
extends = env:esp32-c3-devkitm-1
build_flags =
    ${env.build_flags}
    -DKISS_OVER_USB=1

[env:esp32-c3-minimal]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
build_src_filter =
    +<minimal_main.cpp>
    +<svfprintf_stub.cpp>
board_build.usb = cdc
upload_speed = 115200
board_build.flash_mode = dio
build_flags =
    -DDEBUG_ENABLED=1
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DUSB_VID=0x303A
    -DUSB_PID=0x1001

; Add other environments as needed

; ESP32-C6
[env:esp32-c6-devkitc-1]
; board = esp32-c6-devkitc-1
