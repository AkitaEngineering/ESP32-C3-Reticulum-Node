; Unit test environment
[env:test]
platform = ${common.espressif32_platform}
framework = arduino
board = esp32-c3-devkitm-1
board_build.flash_mode = dio
board_build.f_flash = 40000000L
board_build.partitions = default.csv
monitor_speed = 115200
lib_deps =
    ${common.monocypher_lib_dep}
build_flags =
    -DDEBUG_ENABLED=1
    -DDISABLE_WIFI
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
test_build_src = yes
build_src_filter =
    +<*>
    +<svfprintf_stub.cpp>
    -<minimal_main.cpp>
    -<main.c>
    -<main.cpp>
    -<integration_main.cpp>
    -<test_serial_main.cpp>
    -<bare_blink.c>
    -<kiss_usb_test.cpp>
    -<main.original.cpp>
