name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: |
          python -m pip install -U pip
          pip install platformio==6.1.19
          pio --version

      - name: Validate repository and provisioning tools
        run: python -m unittest discover -s tools/tests -v

      - name: Validate scripts and configuration files
        run: |
          python -m compileall -q tools tests
          bash -n tools/*.sh
          python -c 'import json,pathlib,subprocess; files=subprocess.run(["git","ls-files","*.json"],check=True,capture_output=True,text=True).stdout.splitlines(); [json.loads(pathlib.Path(p).read_text()) for p in files]'
          python -c 'import pathlib,yaml; files=list(pathlib.Path(".github/workflows").glob("*.yml"))+list(pathlib.Path("docs").glob("*.yaml")); [yaml.safe_load(p.read_text()) for p in files]'

      - name: Run C and C++ static analysis
        run: |
          sudo apt-get update
          sudo apt-get install -y cppcheck
          cppcheck --enable=warning,performance,portability --error-exitcode=1 --inline-suppr --suppress=missingIncludeSystem --suppress=missingInclude --std=c++17 -I include src include test

      - name: Build canonical managed production firmware
        run: pio run

      - name: Build offline USB production firmware
        run: pio run -e esp32-c3-prod-usb

      - name: Build ESP32-C3 Web-enabled environment
        run: pio run -e esp32-c3-web

      - name: Build ESP32-C3 minimal environment
        run: pio run -e esp32-c3-minimal

      - name: Build test-serial (compile-only)
        run: pio run -e test-serial

      - name: Verify _svfprintf_r symbol in C3 minimal ELF
        run: |
          set -e
          pio run -e esp32-c3-minimal
          # prefer toolchain nm; fallback to strings if nm not available
          if command -v riscv32-esp-elf-nm >/dev/null 2>&1; then
            riscv32-esp-elf-nm .pio/build/esp32-c3-minimal/firmware.elf | grep -q _svfprintf_r
          elif [ -f "$HOME/.platformio/packages/toolchain-riscv32-esp/bin/riscv32-esp-elf-nm" ]; then
            "$HOME/.platformio/packages/toolchain-riscv32-esp/bin/riscv32-esp-elf-nm" .pio/build/esp32-c3-minimal/firmware.elf | grep -q _svfprintf_r
          else
            strings .pio/build/esp32-c3-minimal/firmware.elf | grep -q _svfprintf_r
          fi

      - name: Build ESP32 (original) environment
        run: pio run -e esp32dev

      - name: Compile hardware unit test firmware
        run: pio test -e test --without-uploading --without-testing

      - name: Record firmware checksums
        run: sha256sum .pio/build/esp32-c3-prod-managed/firmware.bin .pio/build/esp32-c3-prod-managed/firmware.elf > firmware.sha256

      - name: Upload canonical firmware artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: esp32-c3-prod-managed-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            .pio/build/esp32-c3-prod-managed/firmware.bin
            .pio/build/esp32-c3-prod-managed/firmware.elf
            .pio/build/esp32-c3-prod-managed/firmware.map
            firmware.sha256
