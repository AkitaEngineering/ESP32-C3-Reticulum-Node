name: Build (PlatformIO)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install -U platformio
      - name: Build esp32-c3-web
        run: pio run -e esp32-c3-web -v
      - name: Build ttgo-minimal
        run: pio run -e ttgo-minimal -v
