name: Hardware acceptance

on:
  workflow_dispatch:
    inputs:
      unit_test_port:
        description: Serial port for the unit-test board
        required: true
        default: /dev/serial/by-id/esp32-unit-test
      kiss_port:
        description: USB KISS port for relay node A
        required: true
        default: /dev/serial/by-id/esp32-kiss-a
      receiver_port:
        description: Debug port for relay node B
        required: true
        default: /dev/serial/by-id/esp32-debug-b

permissions:
  contents: read

jobs:
  hardware:
    runs-on: [self-hosted, linux, esp32-c3-hil]
    timeout-minutes: 30
    env:
      UNIT_TEST_PORT: ${{ inputs.unit_test_port }}
      KISS_PORT: ${{ inputs.kiss_port }}
      RECEIVER_PORT: ${{ inputs.receiver_port }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Install pinned test tooling
        run: pip install platformio==6.1.19 pyserial==3.5
      - name: Execute firmware unit tests on hardware
        run: pio test -e test --upload-port "$UNIT_TEST_PORT" --test-port "$UNIT_TEST_PORT"
      - name: Flash relay node A
        run: pio run -e esp32-c3-prod-managed -t upload --upload-port "$KISS_PORT"
      - name: Flash receiver node B
        run: pio run -e esp32-c3-integration-rx -t upload --upload-port "$RECEIVER_PORT"
      - name: Run two-node KISS and ESP-NOW relay acceptance
        run: python tests/kiss_mesh_relay_test.py --kiss-port "$KISS_PORT" --receiver-port "$RECEIVER_PORT" --timeout 30
