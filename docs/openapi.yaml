openapi: 3.0.3
info:
  title: ESP32 Reticulum Gateway API
  version: "1.0.0"
  description: OpenAPI spec for the small REST API implemented by the ESP32 Reticulum Gateway.
servers:
  - url: http://{host}:{port}
    variables:
      host:
        default: "<device-ip>"
      port:
        default: "80"
paths:
  /api/v1/status:
    get:
      summary: Node status
      responses:
        '200':
          description: Node status JSON
          content:
            application/json:
              schema:
                type: object
                properties:
                  node_name:
                    type: string
                  device_id:
                    type: string
                  rns_app_name:
                    type: string
                  uptime_s:
                    type: integer
                  free_heap:
                    type: integer
                  active_links:
                    type: integer
                  route_count:
                    type: integer
                  route_candidate_count:
                    type: integer
                  config_present:
                    type: boolean
                  bootstrap_mode:
                    type: boolean
                  wifi_connected:
                    type: boolean
                  wifi_ip:
                    type: string
                  route_candidates_by_interface:
                    type: object
                    additionalProperties:
                      type: integer
                  interfaces:
                    type: object
                    additionalProperties:
                      type: object
                      properties:
                        supported:
                          type: boolean
                        usable:
                          type: boolean
                        last_rx_uptime_ms:
                          type: integer
                        last_tx_uptime_ms:
                          type: integer
                        rx_packets:
                          type: integer
                        tx_packets:
                          type: integer
                        rx_bytes:
                          type: integer
                        tx_bytes:
                          type: integer
                  restart_required:
                    type: boolean
                  restart_reason:
                    type: string

  /api/v1/config:
    get:
      summary: Read runtime JSON config
      security:
        - bearerAuth: []
      responses:
        '200':
          description: JSON configuration
          content:
            application/json:
              schema:
                type: object
    post:
      summary: Write runtime JSON config
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Saved configuration
          headers:
            X-Restart-Required:
              schema:
                type: string
              description: `true` when the saved configuration requires a restart to take full effect.
            X-Restart-Reason:
              schema:
                type: string
              description: Present when `X-Restart-Required` is `true`; currently used for `rns_app_name_changed`.
          content:
            application/json:
              schema:
                type: object

  /api/v1/config/save:
    post:
      summary: Persist staged runtime config
      security:
        - bearerAuth: []
      responses:
        '200':
          description: saved
          content:
            text/plain:
              schema:
                type: string
        '500':
          description: no config to save

  /api/v1/ota:
    post:
      summary: Signed OTA upload
      security:
        - bearerAuth: []
      parameters:
        - in: header
          name: X-Signature-Ed25519
          schema:
            type: string
          required: true
          description: Hex-encoded Ed25519 signature for the uploaded binary
      requestBody:
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                type: string
        '400':
          description: Bad request or incomplete upload
        '403':
          description: Invalid signature

  /api/v1/metrics:
    get:
      summary: Node metrics
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Metrics JSON
          content:
            application/json:
              schema:
                type: object
                properties:
                  heap_free:
                    type: integer
                  uptime_s:
                    type: integer
                  active_links:
                    type: integer
                  route_count:
                    type: integer
                  route_candidate_count:
                    type: integer
                  interfaces:
                    type: object
                    additionalProperties:
                      type: object
                      properties:
                        supported:
                          type: boolean
                        usable:
                          type: boolean
                        last_rx_uptime_ms:
                          type: integer
                        last_tx_uptime_ms:
                          type: integer
                        rx_packets:
                          type: integer
                        tx_packets:
                          type: integer
                        rx_bytes:
                          type: integer
                        tx_bytes:
                          type: integer

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
